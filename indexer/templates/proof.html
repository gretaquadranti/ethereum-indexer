<!doctype html>
<html>
  <head>
    <title>Verkle Proof</title>
    <style>
      body {
        font-family: monospace;
        padding: 2rem;
        background: #1a1a1a;
        color: #fff;
      }
      input {
        background: #2a2a2a;
        color: #fff;
        border: 1px solid #444;
        padding: 0.5rem;
        border-radius: 4px;
      }
      h1 {
        color: #6c63ff;
      }
    </style>
  </head>
  <body>
    <h1>Blocco {{ block_number }}</h1>
    <p>Hash: {{ block_hash }}</p>
    <p>
      Prova valida: {% if proof_valid %}combaciano{% else %}X - è stata
      manomessa{% endif %}
    </p>
    <p>Root: {{ root_attuale }}</p>
    <p>commitment_nella_prova: {{commitment_nella_prova}}</p>
  </body>
</html>

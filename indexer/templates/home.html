<!DOCTYPE html>
<html>
<head>
    <title>Ethereum Verkle Indexer</title>
    <style>
        body { font-family: monospace; padding: 2rem; background: #1a1a1a; color: #fff; }
        input { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 0.5rem; border-radius: 4px; }
        button { background: #6c63ff; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        h1 { color: #6c63ff; }
    </style>
</head>
<body>
    <h1>Ethereum Verkle Indexer</h1>
    <p>Inserisci un numero di blocco per ottenere la prova:</p>
    
    <input type="number" id="blocco" />
    <button onclick="cerca()">Cerca</button>

    <script>
        function cerca() {
            const n = document.getElementById('blocco').value;
            if (n) window.location.href = '/proof/' + n;
        }
    </script>
</body>
</html>
